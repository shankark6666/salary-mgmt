# Static analysis for security bugs (injection, unsafe deserialisation, path traversal, ...).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on private repositories requires GitHub Advanced Security; the repository
    # is made public for submission, from which point this runs on every PR.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended
      - run: ./mvnw -B -q -DskipTests package
        working-directory: backend
      - uses: github/codeql-action/analyze@v3
