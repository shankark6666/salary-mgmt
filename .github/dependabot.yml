# Weekly PRs for vulnerable or outdated dependencies; CI must pass before they merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Framework majors (Spring Boot 4, springdoc 3) are planned migrations, not weekly bumps.
    # Patch and minor releases — where security fixes land — still arrive automatically.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packages that only work at matching versions move in one PR. A react bump without
    # react-dom failed CI with "Incompatible React versions" (#35).
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      tooling:
        patterns: ["vitest", "@vitest/*", "vite", "@vitejs/*", "@testing-library/*", "jsdom"]
    # Frontend tracks the latest majors; each update is verified (tests, build, browser) before merging.
    # TypeScript and ESLint are held at the newest versions eslint-config-next supports.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Keeps the Dockerfile base images (JRE, Node, Postgres in compose) patched.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Runtime majors (Java, Node) are deliberate upgrades: the image must run the same major the
    # tests run on (CI uses Java 21 / Node 22), and only LTS lines belong in production.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # Runtime majors (Java, Node) are deliberate upgrades: the image must run the same major the
    # tests run on (CI uses Java 21 / Node 22), and only LTS lines belong in production.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
