# Weekly PRs for vulnerable or outdated dependencies; CI must pass before they merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Framework majors (Spring Boot 4, springdoc 3) are planned migrations, not weekly bumps.
    # Patch and minor releases — where security fixes land — still arrive automatically.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Frontend tracks the latest majors; each update is verified (tests, build, browser) before merging.
    # TypeScript and ESLint are held at the newest versions eslint-config-next supports.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
