# Weekly PRs for vulnerable or outdated dependencies; CI must pass before they merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Framework majors (Spring Boot 4, springdoc 3) are planned migrations, not weekly bumps.
    # Patch and minor releases — where security fixes land — still arrive automatically.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Angular packages only work at matching versions, so they move in one PR (a split bump fails
    # the build); the same holds for the test tooling.
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "angular-eslint", "typescript"]
      tooling:
        patterns: ["vitest", "@vitest/*", "jsdom", "@testing-library/*", "eslint", "@eslint/*", "typescript-eslint"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Angular compiler supports TypeScript >=6.0 <6.1; TypeScript 7 fails the build (#45).
      # Raise this together with an Angular release that supports the newer TypeScript.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  # Keeps the Dockerfile base images (JRE, Node, Postgres in compose) patched.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Runtime majors (Java, Node) are deliberate upgrades: the image must run the same major the
    # tests run on (CI uses Java 21 / Node 24), and only LTS lines belong in production.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Node in the build stage: LTS majors only, matching CI (Node 24).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # nginx odd minors (1.31) are the mainline branch; production stays on the stable line
      # (1.30.x patches still arrive). Move to the next stable (1.32) deliberately (#44).
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
