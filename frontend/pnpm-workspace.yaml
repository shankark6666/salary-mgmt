# Supply chain: never install a version published in the last 3 days. Freshly published
# releases are where hijacked packages land before they are caught and yanked.
minimumReleaseAge: 4320

# Dependencies allowed to run install scripts; pnpm 12 fails the install for any other that
# tries. unrs-resolver (ESLint import resolution) only fetches its platform binary.
allowBuilds:
  unrs-resolver: true
