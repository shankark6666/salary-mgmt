# Local infrastructure. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
    ports:
      # 5433 on the host so it never collides with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - salary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  salary-pgdata:
