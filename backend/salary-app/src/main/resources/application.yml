spring:
  application:
    name: salary-app
  datasource:
    # reWriteBatchedInserts turns JDBC batches into multi-row INSERTs (~5x faster seeding).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/salary?reWriteBatchedInserts=true}
    username: ${DATABASE_USERNAME:salary}
    password: ${DATABASE_PASSWORD:salary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    # Never echo exception details, messages or stack traces to clients.
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SALARY_SESSION
        http-only: true                       # unreadable from JavaScript, so XSS cannot steal it
        secure: ${COOKIE_SECURE:true}          # HTTPS only; browsers treat localhost as secure
        same-site: strict                     # never sent on cross-site requests

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    bootstrap:
      manager-username: ${BOOTSTRAP_MANAGER_USERNAME:}
      manager-password: ${BOOTSTRAP_MANAGER_PASSWORD:}
      analyst-username: ${BOOTSTRAP_ANALYST_USERNAME:}
      analyst-password: ${BOOTSTRAP_ANALYST_PASSWORD:}
  seed:
    enabled: ${SEED_ENABLED:false}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
    random-seed: 42
    as-of: 2026-10-01

# API docs are attack-surface documentation: off unless explicitly enabled (e.g. locally).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
