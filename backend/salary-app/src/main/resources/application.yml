spring:
  application:
    name: salary-app
  datasource:
    # reWriteBatchedInserts turns JDBC batches into multi-row INSERTs (~5x faster seeding).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/salary?reWriteBatchedInserts=true}
    username: ${DATABASE_USERNAME:salary}
    password: ${DATABASE_PASSWORD:salary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    enabled: ${SEED_ENABLED:false}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
    random-seed: 42
    as-of: 2026-10-01

springdoc:
  swagger-ui:
    path: /swagger-ui.html
